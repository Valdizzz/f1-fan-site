name: Deploy to GitHub Pages

on:
  push:
    branches: 'main'
  # Добавляем возможность ручного запуска из вкладки Actions
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Отменяет старые запуски, если ты сделал новый пуш до завершения предыдущего
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build_site:
    runs-on: ubuntu-latest
    env:
      # Устраняем предупреждение о версии Node.js для самих действий GitHub
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        # Используем ci для более стабильной установки в CI-среде
        run: npm ci || npm install

      - name: Build
        # Передаем секрет из настроек GitHub в процесс сборки Vite
        env:
          VITE_GEMINI_API_KEY: ${{ secrets.VITE_GEMINI_API_KEY }}
        # Добавляем флаг, чтобы билд не падал из-за мелких предупреждений линтера, если они есть
        run: npm run build

      - name: Upload Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist/'

  deploy:
    needs: build_site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4