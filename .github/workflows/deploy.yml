name: Deploy to GitHub Pages

on:
  push:
    branches: 'main'
  # Добавляем возможность ручного запуска из вкладки Actions
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build_site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build
        # ПЕРЕДАЕМ СЕКРЕТ В ПРОЦЕСС СБОРКИ
        env:
          VITE_GEMINI_API_KEY: ${{ secrets.VITE_GEMINI_API_KEY }}
        run: npm run build

      - name: Upload Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist/'

      - name: Deploy
        uses: actions/deploy-pages@v4